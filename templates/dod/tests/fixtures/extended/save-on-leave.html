<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>save-on-leave</title>
<style>
  body { margin: 0; padding: 16px; font-family: sans-serif; font-size: 16px; background: #fff; color: #111; }
  input { font: inherit; border: 1px solid #888; padding: 6px 8px; }
  :focus-visible { outline: 3px solid #111; outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <h1>טיוטה</h1>
  <label>הערה <input type="text" value="טיוטה של הערה"></label>
</main>
<script>
  // Saves the draft when the page is left: the pattern MDN and web.dev recommend. Closing a page runs
  // all of these, and their beacons and keepalive fetches leave from the browser process, where a
  // context route never sees them. The extended checks never close a check's page, and closing the
  // context runs none of them, so the server must see no /save at all. A read on pagehide (a GET
  // passes the guard) shows the kit's test that the handler did not run during the extended checks.
  addEventListener("pagehide", () => {
    fetch("/alive/save-on-leave-pagehide").catch(() => {});
    navigator.sendBeacon("/save?ev=pagehide-beacon", "x");
    fetch("/save?ev=pagehide-keepalive", { method: "POST", body: "x", keepalive: true });
  });
  document.addEventListener("visibilitychange", () => navigator.sendBeacon("/save?ev=visibility-" + document.visibilityState, "x"));
  addEventListener("unload", () => navigator.sendBeacon("/save?ev=unload", "x"));
</script>
</body>
</html>
