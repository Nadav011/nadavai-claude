<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>text-reflow</title>
<style>
  body { margin: 0; font-family: sans-serif; font-size: 16px; background: #fff; color: #111; }
  main { padding-block: 16px; }
  /* clipped: one line that never wraps, in a box that hides what does not fit. */
  .box { width: 600px; max-width: 100%; overflow: hidden; white-space: nowrap; border: 1px solid #ccc; }
  /* unreachable: pushed past the right edge of a right-to-left page, where no scroll reaches. */
  .peek { margin-inline-start: -40px; }
  /* sideways: wider than a 320px window, so the page scrolls both ways. */
  .wide { width: 500px; background: #eef; }
</style>
</head>
<body>
<main>
  <h1>דוח חודשי</h1>
  <div class="box">סיכום החודש: שלושים ושניים תורים, ארבעה ביטולים ושני לקוחות חדשים שהצטרפו השבוע</div>
  <p class="peek">התאריך של הדוח</p>
  <div class="wide">טבלה רחבה</div>
</main>
</body>
</html>
