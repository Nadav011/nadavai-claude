<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>consent-overlay</title>
<style>
  /* A cookie bar painted by a dark backdrop that is its sibling, not its ancestor (a common overlay
     pattern): the white "no" with a white border stands on the dark backdrop as clearly as the "yes",
     so nothing is found. Reading the colour behind it from its ancestors (white) would miss the
     backdrop and call the "no" invisible. */
  body { margin: 0; padding: 16px; font-family: sans-serif; font-size: 16px; background: #fff; color: #111; }
  .backdrop { position: fixed; inset-inline: 0; bottom: 0; height: 140px; background: #111; }
  .bar { position: fixed; inset-inline: 0; bottom: 0; height: 140px; padding: 16px; box-sizing: border-box; color: #fff; }
  .bar button { font: inherit; padding: 10px 20px; border: 1px solid #fff; }
  .bar .yes { background: #1f7a4d; color: #fff; border-color: #1f7a4d; }
  .bar .no { background: transparent; color: #fff; }
</style>
</head>
<body>
<main>
  <h1>החנות שלנו</h1>
  <p>כאן מוצגים המוצרים של החנות, עם המחירים והזמינות שלהם בסניפים.</p>
</main>
<div class="backdrop"></div>
<div class="bar">
  <p>אנחנו משתמשים בעוגיות כדי לזכור את ההעדפות שלך.</p>
  <button type="button" class="yes">אישור הכול</button>
  <button type="button" class="no">דחיית הכול</button>
</div>
</body>
</html>
