<!doctype html>
<html lang="en" dir="ltr" style="overflow-x: hidden">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>text-reflow-ltr</title>
<style>
  /* The root hides what is wider than the window: the page cannot scroll sideways (so no "sideways"),
     and a line that runs off the right of this left-to-right page at 320 cannot be reached. */
  body { margin: 0; font-family: sans-serif; font-size: 16px; background: #fff; color: #111; }
  .long { white-space: nowrap; }
</style>
</head>
<body>
<main>
  <h1>Booking</h1>
  <p class="long">The client asked to move Tuesday's booking to the same time next week</p>
</main>
</body>
</html>
