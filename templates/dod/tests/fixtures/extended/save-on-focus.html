<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>save-on-focus</title>
<style>
  body { margin: 0; padding: 16px; font-family: sans-serif; font-size: 16px; background: #fff; color: #111; }
  input { font: inherit; border: 1px solid #888; padding: 6px 8px; display: block; margin-block: 8px; }
  :focus-visible { outline: 3px solid #111; outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <h1>פרטי לקוחה</h1>
  <!-- An inline field that saves when it gets focus, and one that saves (and sends a beacon) when it
       loses focus: the focus walk of forced-colors must not let either write reach the server. -->
  <label>שם <input id="a" type="text" value="מיכל ברק" onfocus="fetch('/save?focus=1', { method: 'POST', body: 'a' })"></label>
  <label>טלפון <input id="b" type="text" value="050-0000000" onblur="fetch('/save?blur=1', { method: 'POST', body: 'b' }); navigator.sendBeacon('/save?beacon=1', 'b')"></label>
</main>
</body>
</html>
