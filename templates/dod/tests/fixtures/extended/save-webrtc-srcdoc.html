<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>save-webrtc-srcdoc</title>
<style>
  body { margin: 0; padding: 16px; font-family: sans-serif; font-size: 16px; background: #fff; color: #111; }
  input { font: inherit; border: 1px solid #888; padding: 6px 8px; display: block; margin-block: 8px; }
  :focus-visible { outline: 3px solid #111; outline-offset: 2px; }
  iframe { border: 1px solid #888; width: 200px; height: 60px; }
</style>
</head>
<body>
<main>
  <h1>שיחת וידאו במסגרת srcdoc</h1>
  <label>שם <input id="a" type="text" value="מיכל ברק"></label>
  <p>כאן מעדכנים את פרטי הלקוחה של הסניף. השינויים נשמרים לבד ונשלחים לשרת.</p>
</main>
<script>
  // A srcdoc frame, loaded with the page, starts a WebRTC connection with its own RTCPeerConnection when
  // forced colours switch on, after the cut (review 7's F2). The checks take it away in that frame too.
  const onForcedColors = (f) => matchMedia("(forced-colors: active)").addEventListener("change", (e) => { if (e.matches) f(); });
  const frame = document.createElement("iframe");
  frame.title = "מסגרת";
  frame.srcdoc = "<!doctype html><p>מסגרת</p><script>addEventListener('message', async (e) => { if (e.data !== 'forced-colors') return; try { const pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:127.0.0.1:" + location.port + "' }] }); pc.createDataChannel('x'); await pc.setLocalDescription(await pc.createOffer()); window.call = pc; } catch { /* taken away */ } });<\/script>";
  document.querySelector("main").append(frame);
  onForcedColors(() => frame.contentWindow.postMessage("forced-colors", "*"));
</script>
</body>
</html>
