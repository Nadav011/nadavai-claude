<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>text-reflow-layout-table</title>
<style>
  /* A table used only for layout (one column, no header cell): not a part that needs two dimensions,
     so the 560px paragraph in it makes the page scroll sideways at 320, a finding. */
  body { margin: 0; font-family: sans-serif; font-size: 16px; background: #fff; color: #111; }
  table { border-collapse: collapse; }
  td { border: 1px solid #888; padding: 4px; }
</style>
</head>
<body>
<main>
  <h1>דוח</h1>
  <table><tr><td><p style="width: 560px">פסקה ארוכה של טקסט רגיל בתוך טבלה שמשמשת רק לעימוד ולא לנתונים.</p></td></tr></table>
</main>
</body>
</html>
