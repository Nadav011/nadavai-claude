<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>save-xrealm-leave</title>
<style>
  body { margin: 0; padding: 16px; font-family: sans-serif; font-size: 16px; background: #fff; color: #111; }
  input { font: inherit; border: 1px solid #888; padding: 6px 8px; display: block; margin-block: 8px; }
  :focus-visible { outline: 3px solid #111; outline-offset: 2px; }
  iframe { border: 1px solid #888; width: 200px; height: 60px; }
</style>
</head>
<body>
<main>
  <h1>כתיבה דרך מסגרת</h1>
  <label>שם <input id="a" type="text" value="מיכל ברק"></label>
  <p>כאן מעדכנים את פרטי הלקוחה של הסניף. השינויים נשמרים לבד ונשלחים לשרת.</p>
</main>
<script>
  // Review 6's B1: the page leaves when forced colours switch on, and its pagehide writes through a
  // same-origin frame's realm (the frame is alive and not leaving), and through a listener made in that
  // realm. The network is cut from the start of the check, so none of them reaches the server; the check
  // is "not checked: the page left its route".
  const onForcedColors = (f) => matchMedia("(forced-colors: active)").addEventListener("change", (e) => { if (e.matches) f(); });
  const t = (f) => { try { const r = f(); if (r && r.catch) r.catch(() => {}); } catch { /* keep going */ } };
  const fr = document.createElement("iframe");
  fr.title = "מסגרת";
  document.querySelector("main").append(fr);
  const W = fr.contentWindow;
  addEventListener("pagehide", () => {
    t(() => W.navigator.sendBeacon("/save/xrealm/ifr-beacon", "x"));
    t(() => W.fetch("/save/xrealm/ifr-keepalive", { method: "POST", body: "x", keepalive: true }));
    t(() => W.fetch("/save/xrealm/ifr-plain", { method: "POST", body: "x" }));
    t(() => { const x = new W.XMLHttpRequest(); x.open("POST", "/save/xrealm/ifr-xhr", false); x.send("x"); });
  });
  addEventListener("pagehide", W.Function("top.navigator.sendBeacon('/save/xrealm/listener-beacon', 'x'); top.fetch('/save/xrealm/listener-keepalive', { method: 'POST', body: 'x', keepalive: true }).catch(() => {});"));
  onForcedColors(() => { location.href = "/clean"; });
</script>
</body>
</html>
