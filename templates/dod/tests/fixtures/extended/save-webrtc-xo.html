<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>save-webrtc-xo</title>
<style>
  body { margin: 0; padding: 16px; font-family: sans-serif; font-size: 16px; background: #fff; color: #111; }
  input { font: inherit; border: 1px solid #888; padding: 6px 8px; display: block; margin-block: 8px; }
  :focus-visible { outline: 3px solid #111; outline-offset: 2px; }
  iframe { border: 1px solid #888; width: 200px; height: 60px; }
</style>
</head>
<body>
<main>
  <h1>שיחת וידאו במסגרת ממקור אחר</h1>
  <label>שם <input id="a" type="text" value="מיכל ברק"></label>
  <p>כאן מעדכנים את פרטי הלקוחה של הסניף. השינויים נשמרים לבד ונשלחים לשרת.</p>
  <iframe id="xo" title="מסגרת" src="about:blank"></iframe>
  <script>document.getElementById("xo").src = "http://localhost:" + location.port + "/save-webrtc-xo-child";</script>
</main>
<script>
  // A frame of another origin starts a WebRTC connection when forced colours switch on, after the cut
  // (review 7's F2). The checks take RTCPeerConnection away in that frame too, so the run is "not checked".
  const onForcedColors = (f) => matchMedia("(forced-colors: active)").addEventListener("change", (e) => { if (e.matches) f(); });
  const fr = document.getElementById("xo");
  onForcedColors(() => fr.contentWindow.postMessage("forced-colors", "*"));
</script>
</body>
</html>
