<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>clean</title>
<style>
  body { margin: 0; font-family: sans-serif; font-size: 16px; background: #fff; color: #111; }
  header { display: flex; gap: 16px; padding: 12px 16px; border-block-end: 1px solid #ddd; }
  main { padding: 16px; max-width: 60rem; }
  a { color: #1d4ed8; }
  /* The fix for forced colours: a transparent border is drawn in the system colour there. */
  button, .field { font: inherit; border: 1px solid transparent; border-radius: 8px; padding: 8px 12px; }
  button { background: #2563eb; color: #fff; }
  .field { border-color: #888; background: #fff; color: #111; }
  :focus-visible { outline: 3px solid #111; outline-offset: 2px; }
  [role="tablist"] { display: flex; gap: 4px; margin-block: 16px; }
  [role="tab"] { background: #eee; color: #111; border-width: 0 0 3px; border-style: solid; border-color: transparent; border-radius: 0; }
  [role="tab"][aria-selected="true"] { border-block-end-color: #2563eb; font-weight: 700; }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: #16a34a; }
  .table-wrap { overflow-x: auto; }
  table { border-collapse: collapse; min-width: 520px; }
  td, th { border: 1px solid #ccc; padding: 4px 8px; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  /* A count badge over the corner of its label: overlapping on purpose, before any text spacing. */
  .labelled { position: relative; display: inline-block; padding: 4px 8px; }
  .badge { position: absolute; inset-block-start: -4px; inset-inline-end: 0; background: #dc2626; color: #fff; border-radius: 999px; font-size: 12px; line-height: 1; padding: 2px 5px; }
</style>
</head>
<body>
<header>
  <a href="#calendar">יומן</a>
  <a href="#clients">לקוחות</a>
  <span class="sr-only">תפריט ראשי</span>
</header>
<main>
  <h1>התורים של היום</h1>
  <p>כאן רואים את כל התורים של היום, ואפשר לקבוע תור חדש או לשנות תור שכבר נקבע.</p>
  <label for="name">שם מלא</label>
  <input id="name" class="field" type="text" autocomplete="name">
  <button type="button">קביעת תור</button>
  <div role="tablist" aria-label="תצוגה">
    <button type="button" role="tab" aria-selected="true">יום</button>
    <button type="button" role="tab" aria-selected="false">שבוע</button>
  </div>
  <p><span class="dot"></span> היומן מחובר</p>
  <p><span class="labelled">הודעות<span class="badge">3</span></span></p>
  <form>
    <label><input type="checkbox" name="news"> אני רוצה לקבל עדכונים ומבצעים במייל</label>
  </form>
  <section aria-label="עוגיות">
    <p>האתר משתמש בעוגיות כדי לזכור את ההעדפות שלך. אפשר לשנות את הבחירה בכל זמן בהגדרות.</p>
    <label><input type="checkbox" checked disabled> עוגיות הכרחיות (תמיד פועלות)</label>
    <button type="button">אישור הכול</button>
    <button type="button">דחיית הכול</button>
  </section>
  <div class="table-wrap">
    <table>
      <tr><th>שעה</th><th>לקוח</th><th>טיפול</th><th>הערה</th></tr>
      <tr><td>09:00</td><td>מיכל ברק</td><td>תספורת</td><td>מגיעה עם הבת שלה</td></tr>
    </table>
  </div>
</main>
</body>
</html>
