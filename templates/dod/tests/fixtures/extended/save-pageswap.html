<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>save-pageswap</title>
<style>
  body { margin: 0; padding: 16px; font-family: sans-serif; font-size: 16px; background: #fff; color: #111; }
  input { font: inherit; border: 1px solid #888; padding: 6px 8px; display: block; margin-block: 8px; }
  :focus-visible { outline: 3px solid #111; outline-offset: 2px; }
  iframe { border: 1px solid #888; width: 200px; height: 60px; }
</style>
</head>
<body>
<main>
  <h1>מעבר עם pageswap</h1>
  <label>שם <input id="a" type="text" value="מיכל ברק"></label>
  <p>כאן מעדכנים את פרטי הלקוחה של הסניף. השינויים נשמרים לבד ונשלחים לשרת.</p>
</main>
<script>
  // Review 6: writes in pageswap (fired on the old document as a navigation commits), in the
  // Navigation API's navigate event, and in the same task that starts the navigation.
  const onForcedColors = (f) => matchMedia("(forced-colors: active)").addEventListener("change", (e) => { if (e.matches) f(); });
  const t = (f) => { try { const r = f(); if (r && r.catch) r.catch(() => {}); } catch { /* keep going */ } };
  addEventListener("pageswap", () => {
    t(() => navigator.sendBeacon("/save/pageswap/beacon", "x"));
    t(() => fetch("/save/pageswap/keepalive", { method: "POST", body: "x", keepalive: true }));
  });
  if (window.navigation) navigation.addEventListener("navigate", () => t(() => navigator.sendBeacon("/save/pageswap/navigate", "x")));
  onForcedColors(() => {
    t(() => navigator.sendBeacon("/save/pageswap/same-task", "x"));
    location.href = "/clean";
  });
</script>
</body>
</html>
