<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>save-in-shared-worker</title>
<style>
  body { margin: 0; padding: 16px; font-family: sans-serif; font-size: 16px; background: #fff; color: #111; }
  input { font: inherit; border: 1px solid #888; padding: 6px 8px; }
  :focus-visible { outline: 3px solid #111; outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <h1>סנכרון</h1>
  <label>שם <input type="text" value="נועה לוי"></label>
</main>
<script>
  // A SharedWorker that saves when the page tells it forced colours switched on. Its requests never
  // reach a context route; they go through the run's proxy, whose cut stops them.
  let port = null;
  try {
    port = new SharedWorker("/save-shared-worker.js").port;
  } catch {
    port = null;
  }
  matchMedia("(forced-colors: active)").addEventListener("change", (e) => {
    if (e.matches && port) port.postMessage("forced-colors");
  });
</script>
</body>
</html>
