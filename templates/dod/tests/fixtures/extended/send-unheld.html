<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>send-unheld</title>
<style>
  body { margin: 0; padding: 16px; font-family: sans-serif; font-size: 16px; background: #fff; color: #111; }
  input { font: inherit; border: 1px solid #888; padding: 6px 8px; display: block; margin-block: 8px; }
  :focus-visible { outline: 3px solid #111; outline-offset: 2px; }
  iframe { border: 1px solid #888; width: 200px; height: 60px; }
</style>
</head>
<body>
<main>
  <h1>ערוצים שלא נעצרים</h1>
  <label>שם <input id="a" type="text" value="מיכל ברק"></label>
  <label>טלפון <input id="b" type="text" value="050-0000000"></label>
  <p>כאן מעדכנים את פרטי הלקוחה של הסניף. השינויים נשמרים לבד ונשלחים לשרת, כמו באפליקציה אמיתית שעובדת עם תורים, הודעות ותשלומים.</p>
</main>
<script>
  // The sends no route sees, when forced colours switch on: a WebSocket message, a WebRTC data channel
  // message, a WebTransport session. The guard cannot hold them; it counts them, and the result says so.
  const onForcedColors = (f) => matchMedia("(forced-colors: active)").addEventListener("change", (e) => { if (e.matches) f(); });
  onForcedColors(() => {
    try { const ws = new WebSocket("ws://" + location.host + "/ws"); ws.send("x"); } catch { /* not open yet */ }
    try { const pc = new RTCPeerConnection(); pc.createDataChannel("x").send("x"); } catch { /* not open yet */ }
    try { new WebTransport("https://" + location.host + "/wt"); } catch { /* no server */ }
  });
</script>
</body>
</html>
