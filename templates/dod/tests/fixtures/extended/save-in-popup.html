<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>save-in-popup</title>
<style>
  body { margin: 0; padding: 16px; font-family: sans-serif; font-size: 16px; background: #fff; color: #111; }
  input { font: inherit; border: 1px solid #888; padding: 6px 8px; }
  :focus-visible { outline: 3px solid #111; outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <h1>תשלום</h1>
  <label>סכום <input type="text" value="120"></label>
</main>
<script>
  // Opens a window when forced colours switch on, and that window saves as it loads
  // (popup-save.html): a write of another page of the check's context.
  let opened = false;
  matchMedia("(forced-colors: active)").addEventListener("change", (e) => {
    if (e.matches && !opened) {
      opened = true;
      window.open("/popup-save", "_blank");
    }
  });
</script>
</body>
</html>
