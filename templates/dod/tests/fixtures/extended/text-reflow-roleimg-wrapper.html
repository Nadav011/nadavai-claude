<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>text-reflow-roleimg-wrapper</title>
<style>
  /* role="img" on a wrapper of the page's main region does not excuse the page: the 560px card in it makes
     the page scroll sideways at 320, a finding. */
  body { margin: 0; padding: 16px; font-family: sans-serif; font-size: 16px; background: #fff; color: #111; }
  .card { width: 560px; border: 1px solid #888; padding: 8px; }
</style>
</head>
<body>
<div role="img" aria-label="עמוד">
  <main>
    <h1>עמוד</h1>
    <div class="card">כרטיס ברוחב קבוע שגורם לגלילה לצדדים בכל המסך.</div>
  </main>
</div>
</body>
</html>
