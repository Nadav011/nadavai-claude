<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>text-spacing</title>
<style>
  body { margin: 0; padding: 16px; font-family: sans-serif; background: #fff; color: #111; }
  /* clipped: three lines in a box of fixed height that fits them only at their own line height. */
  .note { font-size: 14px; line-height: 16px; height: 52px; overflow: hidden; width: 240px; border: 1px solid #ccc; }
  /* overlap: a line placed by hand just below a two-line title; taller lines run into it. */
  .card { position: relative; width: 260px; height: 80px; margin-block-start: 24px; }
  .title { margin: 0; font-size: 16px; line-height: 18px; }
  .meta { position: absolute; inset-block-start: 40px; inset-inline-start: 0; font-size: 14px; line-height: 16px; }
  /* clipped by letter spacing alone: one word in a box 5% wider than the word (set by the script). */
  .word { display: inline-block; overflow: hidden; white-space: nowrap; font-size: 16px; margin-block-start: 16px; }
  /* overlap by paragraph spacing alone: two paragraphs in a box of fixed height, the next line right
     after the box; only the 2em after each paragraph pushes the second one into it. */
  .paras { height: 60px; margin-block-start: 16px; }
  .paras p, .after { margin: 0; font-size: 14px; line-height: 16px; }
</style>
</head>
<body>
<main>
  <h1>כרטיס לקוח</h1>
  <div class="note">הערה ראשונה<br>הערה שנייה<br>הערה שלישית</div>
  <div class="card">
    <p class="title">מיכל ברק<br>לקוחה מאז 2024</p>
    <span class="meta">עודכן היום</span>
  </div>
  <div><span class="word" id="word">התחייבויות</span></div>
  <div class="paras"><p>ביקור אחרון</p><p>תור הבא</p></div>
  <p class="after">אין הערות</p>
</main>
<script>
  const w = document.getElementById("word");
  w.style.width = `${w.getBoundingClientRect().width * 1.05}px`;
</script>
</body>
</html>
