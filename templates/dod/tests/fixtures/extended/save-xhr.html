<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>save-xhr</title>
<style>
  body { margin: 0; padding: 16px; font-family: sans-serif; font-size: 16px; background: #fff; color: #111; }
  input { font: inherit; border: 1px solid #888; padding: 6px 8px; display: block; margin-block: 8px; }
  :focus-visible { outline: 3px solid #111; outline-offset: 2px; }
  iframe { border: 1px solid #888; width: 200px; height: 60px; }
</style>
</head>
<body>
<main>
  <h1>שמירה ב-XHR</h1>
  <label>שם <input id="a" type="text" value="מיכל ברק"></label>
  <label>טלפון <input id="b" type="text" value="050-0000000"></label>
  <p>כאן מעדכנים את פרטי הלקוחה של הסניף. השינויים נשמרים לבד ונשלחים לשרת, כמו באפליקציה אמיתית שעובדת עם תורים, הודעות ותשלומים.</p>
</main>
<script>
  // XMLHttpRequest, asynchronous and synchronous, when forced colours switch on.
  const onForcedColors = (f) => matchMedia("(forced-colors: active)").addEventListener("change", (e) => { if (e.matches) f(); });
  onForcedColors(() => {
    const a = new XMLHttpRequest();
    a.open("POST", "/save/xhr/async");
    a.send("x");
    const s = new XMLHttpRequest();
    s.open("POST", "/save/xhr/sync", false);
    try { s.send("x"); } catch { /* cut off: the request fails */ }
  });
</script>
</body>
</html>
