<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cut-banner</title>
<style>
  body { margin: 0; padding: 16px; font-family: sans-serif; font-size: 16px; background: #fff; color: #111; }
  input { font: inherit; border: 1px solid #888; padding: 6px 8px; display: block; margin-block: 8px; }
  :focus-visible { outline: 3px solid #111; outline-offset: 2px; }
  iframe { border: 1px solid #888; width: 200px; height: 60px; }
</style>
</head>
<body>
<main>
  <h1>פרטי לקוחה עם חיבור חי</h1>
  <label>שם <input id="a" type="text" value="מיכל ברק"></label>
  <p>כאן מעדכנים את פרטי הלקוחה של הסניף. השינויים נשמרים לבד ונשלחים לשרת.</p>
</main>
<script>
  // A page that shows when its connection drops (a realtime client's "reconnecting" banner): its
  // socket closes when the network is cut, and the page shows a banner with a button. The check then
  // measures that state, and the result says the page changed when it was cut off.
  const onForcedColors = (f) => matchMedia("(forced-colors: active)").addEventListener("change", (e) => { if (e.matches) f(); });
  const t = (f) => { try { const r = f(); if (r && r.catch) r.catch(() => {}); } catch { /* keep going */ } };
  const ws = new WebSocket("ws://" + location.host + "/ws/banner");
  ws.onclose = () => {
    const box = document.createElement("section");
    box.setAttribute("role", "alert");
    box.innerHTML = "<h2>החיבור לשרת נותק, מנסים להתחבר מחדש</h2><p>השינויים שלך יישמרו כשהחיבור יחזור. אפשר להמשיך לעבוד בינתיים, או לנסות להתחבר עכשיו.</p><button type='button'>לנסות שוב עכשיו</button>";
    document.querySelector("main").prepend(box);
  };
</script>
</body>
</html>
