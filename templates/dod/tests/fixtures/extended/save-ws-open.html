<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>save-ws-open</title>
<style>
  body { margin: 0; padding: 16px; font-family: sans-serif; font-size: 16px; background: #fff; color: #111; }
  input { font: inherit; border: 1px solid #888; padding: 6px 8px; display: block; margin-block: 8px; }
  :focus-visible { outline: 3px solid #111; outline-offset: 2px; }
  iframe { border: 1px solid #888; width: 200px; height: 60px; }
</style>
</head>
<body>
<main>
  <h1>WebSocket פתוח</h1>
  <label>שם <input id="a" type="text" value="מיכל ברק"></label>
  <p>כאן מעדכנים את פרטי הלקוחה של הסניף. השינויים נשמרים לבד ונשלחים לשרת.</p>
</main>
<script>
  // A socket that is really open (it was opened at load; review 6 found that send-unheld.html sent
  // while CONNECTING, which throws): a message on it when forced colours switch on, and a new socket
  // opened then, which sends when it opens. Neither reaches the server.
  const onForcedColors = (f) => matchMedia("(forced-colors: active)").addEventListener("change", (e) => { if (e.matches) f(); });
  const t = (f) => { try { const r = f(); if (r && r.catch) r.catch(() => {}); } catch { /* keep going */ } };
  const ws = new WebSocket("ws://" + location.host + "/ws/open");
  onForcedColors(() => {
    t(() => ws.send("save-ws-open"));
    const fresh = new WebSocket("ws://" + location.host + "/ws/new");
    fresh.onopen = () => t(() => fresh.send("save-ws-new"));
  });
</script>
</body>
</html>
