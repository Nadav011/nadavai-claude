<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>save-in-worker</title>
<style>
  body { margin: 0; padding: 16px; font-family: sans-serif; font-size: 16px; background: #fff; color: #111; }
  input { font: inherit; border: 1px solid #888; padding: 6px 8px; display: block; margin-block: 8px; }
</style>
</head>
<body>
<main>
  <h1>פרטי לקוחה</h1>
  <label>שם <input id="a" type="text" value="מיכל ברק"></label>
  <p>השמירה כאן נעשית ברקע, בעובד נפרד של הדף, כדי שהמסך לא ייתקע בזמן שהיא נשלחת.</p>
</main>
<script>
  // A dedicated worker that saves when the page tells it forced colours switched on: a write of the
  // check's context that leaves from a worker, which the cut stops like the page's own.
  const worker = new Worker("/save-worker.js");
  matchMedia("(forced-colors: active)").addEventListener("change", (e) => {
    if (e.matches) worker.postMessage("forced-colors");
  });
</script>
</body>
</html>
