<!doctype html>
<!-- Review round 4. Stock shadcn AlertDialog open (a confirm-delete reached by a deep link, or a
     "session expiring" prompt open on load): Radix hides the page with aria-hidden; the action
     is buttonVariants() (bg-primary), the cancel is outline. Behind it, a Tabs list with one tab
     disabled and its reason linked, and a Breadcrumb with the stock ellipsis dropdown trigger. -->
<html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>r4-alert-dialog</title><link rel="stylesheet" href="/real.css"><link rel="stylesheet" href="/real-extra.css">
<style>
[data-slot="alert-dialog-overlay"] { position: fixed; inset: 0; background: rgb(0 0 0 / .5); z-index: 50; }
[data-slot="alert-dialog-content"] { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: calc(100% - 32px); max-width: 512px; padding: 24px; border: 1px solid var(--border); border-radius: 8px; background: #fff; z-index: 50; display: grid; gap: 16px; }
[data-slot="alert-dialog-title"] { font-size: 18px; font-weight: 600; margin: 0; }
[data-slot="alert-dialog-description"] { font-size: 14px; color: var(--muted-foreground); margin: 0; }
[data-slot="alert-dialog-footer"] { display: flex; flex-direction: column-reverse; gap: 8px; }
@media (min-width: 640px) { [data-slot="alert-dialog-footer"] { flex-direction: row; justify-content: flex-end; } }
[data-slot="tabs-list"] { display: inline-flex; height: 36px; padding: 3px; border-radius: 8px; background: var(--muted); }
[data-slot="tabs-trigger"] { border: 0; background: transparent; padding: 0 8px; border-radius: 6px; font: inherit; font-size: 14px; }
[data-slot="tabs-trigger"][data-state="active"] { background: #fff; }
[data-slot="tabs-trigger"]:disabled { opacity: .5; }
[data-slot="breadcrumb-ellipsis"] { display: flex; width: 36px; height: 36px; align-items: center; justify-content: center; }
</style></head><body style="pointer-events:none">
<header aria-hidden="true" data-aria-hidden="true"><span>סטודיו מיכל</span><a data-help="door" data-slot="button" class="border" href="#help">עזרה</a></header>
<main aria-hidden="true" data-aria-hidden="true">
  <nav aria-label="breadcrumb" data-slot="breadcrumb"><ol data-slot="breadcrumb-list">
    <li data-slot="breadcrumb-item"><a data-slot="breadcrumb-link" href="#">בית</a></li>
    <li role="presentation" aria-hidden="true" data-slot="breadcrumb-separator"><svg aria-hidden="true" width="14" height="14"></svg></li>
    <li data-slot="breadcrumb-item"><button type="button" data-slot="dropdown-menu-trigger" aria-haspopup="menu" aria-expanded="false" data-state="closed" style="border:0;background:transparent"><span data-slot="breadcrumb-ellipsis" role="presentation" aria-hidden="true"><svg aria-hidden="true" width="16" height="16"></svg><span class="sr-only">עוד</span></span><span class="sr-only">פתיחת התפריט</span></button></li>
    <li role="presentation" aria-hidden="true" data-slot="breadcrumb-separator"><svg aria-hidden="true" width="14" height="14"></svg></li>
    <li data-slot="breadcrumb-item"><span role="link" aria-disabled="true" aria-current="page" data-slot="breadcrumb-page">מיכל לוי</span></li>
  </ol></nav>
  <div class="page-head"><h1>מיכל לוי</h1><a data-help="screen" href="#help">מה עושים כאן</a></div>
  <div dir="rtl" data-orientation="horizontal" data-slot="tabs">
    <div role="tablist" aria-orientation="horizontal" data-slot="tabs-list" tabindex="0" data-orientation="horizontal" style="outline:none">
      <button type="button" role="tab" aria-selected="true" aria-controls="t-c" data-state="active" id="t-t" data-slot="tabs-trigger" tabindex="-1" data-orientation="horizontal">פרטים</button>
      <button type="button" role="tab" aria-selected="false" aria-controls="t-c2" data-state="inactive" id="t-t2" data-slot="tabs-trigger" tabindex="-1" data-orientation="horizontal">תורים</button>
      <button type="button" role="tab" aria-selected="false" aria-controls="t-c3" data-state="inactive" disabled data-disabled="" id="t-t3" data-slot="tabs-trigger" tabindex="-1" data-orientation="horizontal" aria-describedby="pay-why">תשלומים</button>
    </div>
    <p id="pay-why" style="font-size:14px;color:var(--muted-foreground)">תשלומים יופיעו אחרי החיבור לחשבון הבנק.</p>
    <div data-state="active" data-orientation="horizontal" role="tabpanel" aria-labelledby="t-t" id="t-c" tabindex="0" data-slot="tabs-content"><p>טלפון 050-1234567, לקוחה מאז מרץ 2024.</p></div>
  </div>
  <button type="button" data-slot="button" class="bg-destructive">מחיקת הלקוחה</button>
</main>
<div data-state="open" data-slot="alert-dialog-overlay" style="pointer-events:auto" data-aria-hidden="true" aria-hidden="true"></div>
<div role="alertdialog" id="radix-«a1»" aria-describedby="radix-«a3»" aria-labelledby="radix-«a2»" data-state="open" data-slot="alert-dialog-content" tabindex="-1" style="pointer-events:auto">
  <div data-slot="alert-dialog-header"><h2 id="radix-«a2»" data-slot="alert-dialog-title">למחוק את מיכל לוי?</h2>
  <p id="radix-«a3»" data-slot="alert-dialog-description">אי אפשר לבטל את המחיקה. הלקוחה, התורים שלה וההיסטוריה יימחקו.</p></div>
  <div data-slot="alert-dialog-footer"><button type="button" data-slot="alert-dialog-cancel" class="border" style="height:36px;padding:0 16px;border:1px solid var(--border);border-radius:6px;background:#fff;font:inherit;font-size:14px">ביטול</button><button type="button" data-slot="alert-dialog-action" class="bg-primary" style="height:36px;padding:0 16px;border:0;border-radius:6px;background:var(--primary);color:var(--primary-foreground);font:inherit;font-size:14px">מחיקה</button></div>
</div>
</body></html>
