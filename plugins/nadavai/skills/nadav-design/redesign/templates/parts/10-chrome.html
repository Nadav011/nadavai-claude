{{ICONS}}
<div class="wrap">
<header class="masthead">
  <h1>{{TITLE}}</h1>
  <p class="lede">{{LEDE}}</p>
  <div class="legend">
    <span><b>היום</b> = צילום של האפליקציה כמו שהיא עכשיו</span>
    <span><b>אחרי</b> = העיצוב החדש</span>
    <span><b>מצב</b> = מסך במצב מסוים: ריק, טוען, שגיאה, בלי חיבור, בלי הרשאה</span>
    <span><b>חדש · מאושר</b> = פיצ'ר שאישרת ועוד לא קיים</span>
    <span><b>מוצע</b> = הצעה לאחרי הליבה, במסגרת מקווקוות</span>
  </div>
  <div class="theme-row" role="group" aria-label="ערכת צבעים">
    <button class="tbtn" type="button" data-theme="dark" aria-pressed="false">כהה</button>
    <button class="tbtn" type="button" data-theme="light" aria-pressed="false">בהיר</button>
  </div>
</header>
