# MSI GL66 (i7-11800H). -85 mV crashed (MCE, 2026-10-20); -50 gave an MCE on 2026-10-27. Measured 2026-11-03:
# the effective core VID drops the same with cache 0 or -50 (819 -> 774 mV at 2.6 GHz), so the cache plane
# follows the core here and the cache line is no safety lever. -40 keeps 10 mV under the crash (Nadav's choice).
undervolt 0 'CPU' -40
undervolt 1 'GPU' 0
undervolt 2 'CPU Cache' 0
undervolt 3 'System Agent' 0
undervolt 4 'Analog I/O' 0
