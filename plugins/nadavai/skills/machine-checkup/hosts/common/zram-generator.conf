# Compressed swap twice the size of RAM (CachyOS ships "ram").
# Why: systemd-oomd kills the Orca terminal with the most swap once swap is 90% used, and the
# size it counts is the uncompressed one. On the LENOVO on 2026-11-10, 37.6 GB of swapped pages
# took 5.8 GB of real memory (6.5 to 1), so a 62 GB device reached 56% while memory was free.
# At that ratio a full 124 GB costs about 19 GB of RAM.
[zram0]
compression-algorithm = zstd
zram-size = ram * 2
swap-priority = 100
fs-type = swap
