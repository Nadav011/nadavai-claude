# /tmp lives on disk and is cleaned of files unused for 3 days.
# Why: on tmpfs, agent scratchpads and browser profiles filled zram and systemd-oomd killed
# Orca terminals (LENOVO, 2026-11-07).
q /tmp 1777 root root 3d
# This file replaces systemd's own tmp.conf, so its /var/tmp line is repeated here.
q /var/tmp 1777 root root 30d
