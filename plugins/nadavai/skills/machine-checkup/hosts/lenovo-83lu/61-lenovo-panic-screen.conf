# LENOVO only: keep the kernel's panic screen (blue, with a QR code that holds the kernel log)
# for 60 s before the reboot, instead of the shared 10 s (hosts/common/60-oops-reboot.conf).
# Why: on 2026-11-14 15:21 the machine panicked under heavy swap, Nadav sat in front of it and
# the screen was gone before he could photograph it, and nothing else had saved the text.
# The MSI keeps 10 s: it is the CI agent and nobody watches its screen.
kernel.panic = 60
