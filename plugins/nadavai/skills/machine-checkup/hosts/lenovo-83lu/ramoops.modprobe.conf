# Crash record in RAM (pstore's ramoops backend): the kernel writes its last messages into a
# 4 MB region that the boot option `reserve_mem=4M:4096:oops` sets aside, and
# systemd-pstore.service copies them to /var/lib/systemd/pstore at the next boot.
# Why not efi-pstore: this firmware's variable store is 268 KB with 110 KB free (2026-11-14), and
# a full store can stop a machine from booting (https://bugs.archlinux.org/task/70140).
# max_reason=4 also records an ordinary reboot or shutdown, so every reboot shows whether the
# region survived it; a record that starts with "Panic" or "Oops" is a crash.
options ramoops mem_name=oops record_size=262144 max_reason=4
