# Read-through HTTP cache in front of registry.npmjs.org for the Woodpecker step containers on this
# agent host. It stores what npmjs returned and nothing else: GET and HEAD only, no credentials
# forwarded, so nothing can be published through it. pnpm and npm still check every tarball
# against the integrity hash in the repo's lockfile.
worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
  worker_connections 2048;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  # One line per request; the 6th field is HIT, MISS, EXPIRED, UPDATING, STALE or REVALIDATED.
  log_format npm '$time_iso8601 $request_method $request_uri $status $body_bytes_sent $upstream_cache_status $request_time';
  access_log /dev/stdout npm;

  # Size cap 10 GB (least recently used entries go first); an entry nobody asked for in 30 days goes.
  proxy_cache_path /var/cache/npm levels=1:2 keys_zone=npm:50m max_size=10g inactive=30d use_temp_path=off;

  # Tarballs travel as they are; metadata is requested gzipped (it is large JSON) and unpacked
  # again for a client that does not accept gzip.
  map $uri $upstream_ae {
    ~\.tgz$ "";
    default gzip;
  }

  server {
    listen 4873;
    resolver 127.0.0.11 valid=60s ipv6=off;
    set $upstream registry.npmjs.org;

    if ($request_method !~ ^(GET|HEAD)$) {
      return 405;
    }

    location = /-/ping {
      default_type application/json;
      return 200 '{}';
    }

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host registry.npmjs.org;
    proxy_set_header Authorization "";
    proxy_set_header Cookie "";
    proxy_set_header Accept-Encoding $upstream_ae;
    gunzip on;
    proxy_ssl_server_name on;
    proxy_ssl_name registry.npmjs.org;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_ssl_protocols TLSv1.2 TLSv1.3;
    proxy_connect_timeout 5s;
    proxy_read_timeout 120s;

    # npmjs sends a Cloudflare cookie with every answer, which would stop nginx caching anything.
    proxy_ignore_headers Set-Cookie Cache-Control Expires Vary;
    proxy_hide_header Set-Cookie;

    proxy_cache npm;
    proxy_cache_lock on;
    proxy_cache_revalidate on;
    # An expired entry is served once while it is refreshed in the background, and also when npmjs
    # errors or times out: a slow or failing registry does not stall an install that the cache can answer.
    proxy_cache_background_update on;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    add_header X-Cache-Status $upstream_cache_status always;

    # Package metadata: the same 5 minutes npmjs itself allows (Cache-Control: max-age=300). The key
    # holds the Accept header because npm and pnpm ask for different shapes of the same URL.
    location / {
      proxy_pass https://$upstream;
      proxy_cache_key "$request_uri|$http_accept";
      proxy_cache_valid 200 5m;
    }

    # Tarballs never change for a name and version; a day, then checked again with the ETag, so a
    # version npmjs has removed is not served for long.
    location ~ \.tgz$ {
      proxy_pass https://$upstream;
      proxy_cache_key "$request_uri";
      proxy_cache_valid 200 1d;
    }
  }
}
